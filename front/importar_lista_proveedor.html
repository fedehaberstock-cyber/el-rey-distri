<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="./src/logger.js"></script>
<title>El Rey · Importar lista de proveedor</title>
<style>
  :root{
    --paper:#FBF9F2; --ink:#1C2B27; --ink-soft:#5B665F;
    --line:#E4DECF;  --line-soft:#EEEADD;
    --gold:#A9760E;  --gold-dk:#8A5F09; --gold-lt:#F5E9D0;
    --green-bg:#E7F0E8; --green-tx:#2C6B3F;
    --amber-bg:#FDF2DC; --amber-tx:#8A5F09;
    --red-bg:#F6E5E2;  --red-tx:#A8392B;
    --blue-bg:#E8F0FB; --blue-tx:#2A4E9A;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:contain;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.4}
  body{max-width:820px;margin:0 auto;padding-bottom:120px}

  .hdr{display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--line);background:var(--paper);
    position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .crown{color:var(--gold);font-size:20px}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);
    letter-spacing:.06em;text-transform:uppercase}
  .back{background:none;border:none;font-size:13px;color:var(--gold);font-weight:600;cursor:pointer;font-family:inherit}

  section{padding:14px 18px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:6px}
  .field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);font-size:14px;font-family:inherit;color:var(--ink);appearance:none}
  .field:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  textarea.field{min-height:220px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  select.field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%235B665F' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:42px}

  .btn-gold{background:var(--gold);color:#fff;border:none;padding:12px 16px;border-radius:10px;
    font-weight:600;cursor:pointer;font-family:inherit;font-size:14px}
  .btn-gold:active{background:var(--gold-dk)}
  .btn-gold:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:11px 16px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-red{background:#fff;color:var(--red-tx);border:1px solid var(--red-tx);padding:11px 16px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

  .steps{display:flex;gap:6px;padding:0 18px;margin-bottom:4px}
  .step{flex:1;padding:7px 10px;border-radius:999px;background:var(--line-soft);
    color:var(--ink-soft);font-size:11px;font-weight:600;text-align:center;letter-spacing:.03em}
  .step.on{background:var(--gold);color:#fff}
  .step.done{background:var(--green-bg);color:var(--green-tx)}

  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .box h3{font-size:14px;margin-bottom:8px}
  .box p{font-size:13px;color:var(--ink-soft);margin-bottom:6px}

  .counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .counter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
  .counter .nro{font-size:20px;font-weight:700;line-height:1}
  .counter .lbl{font-size:10px;color:var(--ink-soft);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
  .counter.ok  .nro{color:var(--green-tx)}
  .counter.ign .nro{color:var(--ink-soft)}
  .counter.new .nro{color:var(--blue-tx)}
  .counter.orf .nro{color:var(--amber-tx)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{padding:8px 6px;text-align:left;font-size:11px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);background:var(--paper)}
  tbody td{padding:8px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr.off{opacity:.4}
  tbody tr.off td{text-decoration:line-through}
  td.r{text-align:right}
  td input.precio{width:100px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
    text-align:right;font-family:inherit;font-size:13px;font-weight:600;background:#fff}
  td input.precio:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  td select.mini{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;max-width:220px}
  .cb{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
  .delta-up{color:var(--green-tx);font-weight:600;font-size:11px}
  .delta-down{color:var(--red-tx);font-weight:600;font-size:11px}
  .delta-flat{color:var(--ink-soft);font-size:11px}

  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.03em}
  .chip.map{background:var(--green-bg);color:var(--green-tx)}
  .chip.ign{background:var(--line-soft);color:var(--ink-soft)}
  .chip.new{background:var(--blue-bg);color:var(--blue-tx)}
  .chip.orf{background:var(--amber-bg);color:var(--amber-tx)}

  .empty{text-align:center;padding:40px 18px;color:var(--ink-soft)}
  .loading{text-align:center;padding:48px 18px;color:var(--ink-soft)}
  .err-box{margin:14px 18px;padding:12px;background:var(--red-bg);color:var(--red-tx);border-radius:10px;font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:600;z-index:50}

  .bar{position:fixed;left:0;right:0;bottom:0;max-width:820px;margin:0 auto;
    background:var(--paper);border-top:1px solid var(--line);padding:12px 18px 18px;z-index:20;display:flex;gap:10px}
  .bar button{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="root"><div class="loading">Cargando…</div></div>

<script type="module">
import { supabase } from './src/supabase.js'
import { requireSession, tienePermiso } from './src/auth.js'
import { ars, arsCent } from './src/utils.js?v=2'

const { usuario } = await requireSession()
if (!tienePermiso('catalogo', 'editar')) { location.href = './login_home.html'; throw new Error('sin permiso') }

// ── ESTADO ─────────────────────────────────────────────────────────────
let proveedores = []       // activos
let productos = []         // todos los activos
let proveedorId = ''       // seleccionado
let nombresExt = []        // nombre_externo_proveedor del proveedor elegido
let producProv = []        // producto_proveedor del proveedor elegido (con precio_referencia/ratio)
let paso = 'elegir'        // 'elegir' | 'pegar' | 'clasificar' | 'cambios' | 'listo'
let modoLista = 'referencia'  // 'referencia' = precios al público · 'costos' = lo que te cobran
let cargosExtraPct = 0     // % adicional aplicado al costo (flete, impuesto, etc.)
let resumenListo = null    // { aplicados, mapeados, ignorados, orfanos, provNombre }
let textoCrudo = ''
let lineasParseadas = []   // [{idx, nombre, precio, nombre_norm}]
let lineasDescartes = []   // [string] líneas con texto pero sin precio reconocido
let verDescartes = false
// Clasificación "live" durante el paso de clasificar: nombre_norm → {producto_id|null, estado:'mapeado'|'ignorado'}
let clasif = {}
// Items de cambio en el paso final: {idx, nombre_externo, producto_id, nombre_prod,
//   precio_ref_ant, precio_ref_nuevo, precio_venta_actual, precio_sugerido, costo, aplicar}
let cambios = []
let orfanos = []           // productos mapeados que NO vinieron en la lista
let busquedaProd = ''      // filtro en select de producto durante clasificación

// ── HELPERS ────────────────────────────────────────────────────────────
const normalizar = s => (s || '')
  .toString()
  .toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/\s+/g, ' ')
  .trim()

// Parsea texto pegado. Cada línea = producto. Detecta nombre y precio.
// Reglas: busca el último número en la línea como precio. Lo demás es nombre.
// Soporta "$", separador miles con punto o coma, decimales con coma o punto.
function parsearTexto(txt) {
  const lineas = []
  const descartes = []
  const rows = (txt || '').split(/\r?\n/)
  let idx = 0
  for (const raw of rows) {
    const line = raw.trim()
    if (!line) continue
    // Buscar el ÚLTIMO token numérico. Admite: 1234, 1.234, 1.234,56, 1234.56
    const m = line.match(/(?:\$\s*)?(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*$/)
    if (!m) { descartes.push(line); continue }
    const numTxt = m[1]
    const precio = parsearNumero(numTxt)
    if (!(precio > 0)) { descartes.push(line); continue }
    const nombre = line.slice(0, m.index).replace(/[\s;,\|\t\-–—]+$/, '').trim()
    if (!nombre || nombre.length < 2) { descartes.push(line); continue }
    lineas.push({ idx: idx++, nombre, precio, nombre_norm: normalizar(nombre) })
  }
  // Si hay nombres duplicados en la lista, nos quedamos con el último (lista actualizada).
  const vistos = new Map()
  for (const l of lineas) vistos.set(l.nombre_norm, l)
  return { ok: [...vistos.values()], descartes }
}

// "1.234,56" → 1234.56; "1234.56" → 1234.56; "1.234" → 1234 (3 dígitos = miles)
function parsearNumero(s) {
  if (!s) return 0
  s = s.replace(/\$/g, '').trim()
  // Si tiene coma Y punto, el último es decimal
  const tieneComa = s.includes(',')
  const tienePto  = s.includes('.')
  if (tieneComa && tienePto) {
    const ultCom = s.lastIndexOf(','), ultPto = s.lastIndexOf('.')
    if (ultCom > ultPto) { s = s.replace(/\./g, '').replace(',', '.') }
    else                 { s = s.replace(/,/g, '') }
  } else if (tieneComa) {
    const partes = s.split(',')
    // Si lo que queda después de la coma tiene 1-2 dígitos → es decimal
    if (partes[partes.length-1].length <= 2 && partes.length === 2) s = s.replace(',', '.')
    else s = s.replace(/,/g, '')
  } else if (tienePto) {
    const partes = s.split('.')
    // 3 dígitos después del último punto = separador de miles (ej. "1.234")
    if (partes[partes.length-1].length === 3 && partes.length >= 2) s = s.replace(/\./g, '')
    // else: punto decimal, lo dejamos
  }
  return Number(s) || 0
}

// Redondea al múltiplo de 50 más cercano hacia arriba (00 o 50).
// Mismo criterio que ajustar_precios.html para mantener consistencia.
function redondear50(p) {
  if (!p || p <= 0) return 0
  const base = Math.ceil(p)
  const ult2 = base % 100
  const cien = base - ult2
  if (ult2 === 0) return base
  if (ult2 <= 50) return cien + 50
  return cien + 100
}

const fmtPct = p => {
  if (!isFinite(p) || p === 0) return '0%'
  const s = p > 0 ? '+' : ''
  return s + p.toFixed(1).replace(/\.0$/, '') + '%'
}

// ── CARGA ──────────────────────────────────────────────────────────────
async function cargarInicial() {
  const [{ data: provs, error: e1 }, { data: prods, error: e2 }] = await Promise.all([
    supabase.from('proveedores').select('id, nombre').eq('empresa_id', usuario.empresa_id).eq('activo', true).order('nombre'),
    supabase.from('productos').select('id, nombre, categoria, costo, precio, proveedor_id')
      .eq('empresa_id', usuario.empresa_id).eq('activo', true).order('nombre'),
  ])
  if (e1 || e2) throw e1 || e2
  proveedores = provs || []
  productos = prods || []
}

async function cargarProveedor(provId) {
  const [{ data: nombres, error: e1 }, { data: pps, error: e2 }] = await Promise.all([
    supabase.from('nombre_externo_proveedor')
      .select('id, nombre_externo, nombre_norm, producto_id, estado, factor_conversion')
      .eq('proveedor_id', provId),
    supabase.from('producto_proveedor')
      .select('id, producto_id, precio_referencia, ratio_venta, costo')
      .eq('proveedor_id', provId),
  ])
  if (e1 || e2) throw e1 || e2
  nombresExt = nombres || []
  producProv = pps || []
}

// ── RENDER ─────────────────────────────────────────────────────────────
const root = () => document.getElementById('root')

function render() {
  const r = root()
  const hdr = `
    <div class="hdr">
      <div class="brand"><span class="crown">&#9818;</span>
        <div>El Rey<small>Importar lista de proveedor</small></div>
      </div>
      <button class="back" onclick="location.href='./catalogo_hub.html'">Volver ›</button>
    </div>
    <div class="steps" style="margin-top:12px">
      <div class="step ${paso==='elegir'?'on':'done'}">1 · Proveedor</div>
      <div class="step ${paso==='pegar'?'on':['clasificar','cambios','listo'].includes(paso)?'done':''}">2 · Pegar lista</div>
      <div class="step ${paso==='clasificar'?'on':['cambios','listo'].includes(paso)?'done':''}">3 · Clasificar</div>
      <div class="step ${paso==='cambios'?'on':paso==='listo'?'done':''}">4 · Cambios</div>
    </div>`
  r.innerHTML = hdr
    + (paso === 'elegir'     ? renderElegir()
    : paso === 'pegar'       ? renderPegar()
    : paso === 'clasificar'  ? renderClasificar()
    : paso === 'cambios'     ? renderCambios()
    : paso === 'listo'       ? renderListo()
    : '')
}

function renderListo() {
  const r = resumenListo || {}
  return `<section>
    <div class="box" style="text-align:center;padding:28px 20px;background:var(--green-bg);border-color:var(--green-tx)">
      <div style="font-size:48px;line-height:1">✓</div>
      <h3 style="color:var(--green-tx);margin-top:8px">Lista importada</h3>
      <p style="color:var(--green-tx);margin-top:4px">${r.provNombre || ''}</p>
      <div style="display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap">
        <div><div style="font-size:28px;font-weight:700;color:var(--green-tx)">${r.aplicados || 0}</div><div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em">${r.modo==='costos'?'costos actualizados':'precios actualizados'}</div></div>
        ${r.modo==='costos' && r.venta ? `<div><div style="font-size:28px;font-weight:700;color:var(--green-tx)">${r.venta}</div><div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em">precios de venta</div></div>` : ''}
        ${r.modo==='costos' && r.fijados ? `<div><div style="font-size:28px;font-weight:700;color:var(--green-tx)">${r.fijados}</div><div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em">fijados como preferido</div></div>` : ''}
        <div><div style="font-size:28px;font-weight:700">${r.mapeados || 0}</div><div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em">mapeados</div></div>
        <div><div style="font-size:28px;font-weight:700;color:var(--ink-soft)">${r.ignorados || 0}</div><div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em">ignorados</div></div>
        ${r.orfanos ? `<div><div style="font-size:28px;font-weight:700;color:var(--amber-tx)">${r.orfanos}</div><div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em">sin ${r.modo==='costos'?'costo':'precio'} hoy</div></div>` : ''}
      </div>
    </div>
    <div class="bar">
      <button class="btn-ghost" onclick="location.href='./catalogo_hub.html'">Volver a Catálogo y precios</button>
      <button class="btn-gold" onclick="window._nuevaLista()">Importar otra lista</button>
    </div>
  </section>`
}

function renderElegir() {
  return `<section>
    <div class="box">
      <h3>¿De qué proveedor es esta lista?</h3>
      <p>Elegí el proveedor que publicó la lista. Los nombres externos se guardan por proveedor.</p>
      <label class="lbl">Proveedor</label>
      <select class="field" onchange="window._setProv(this.value)">
        <option value="">— Elegir —</option>
        ${proveedores.map(p => `<option value="${p.id}" ${proveedorId===p.id?'selected':''}>${p.nombre}</option>`).join('')}
      </select>
    </div>
    <div class="box">
      <h3>¿Qué contiene esta lista?</h3>
      <label style="display:flex;gap:10px;padding:12px;border:1px solid ${modoLista==='referencia'?'var(--gold)':'var(--line)'};
        border-radius:10px;cursor:pointer;margin-bottom:8px;${modoLista==='referencia'?'background:var(--gold-lt)':''}">
        <input type="radio" name="modoLista" value="referencia" ${modoLista==='referencia'?'checked':''}
          onchange="window._setModoLista('referencia')" style="margin-top:3px">
        <div>
          <div style="font-weight:700">Precios al público (referencia de mercado)</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">
            Lo que el proveedor publica como precio de venta al público. Se usa para sugerir cambios de tu precio de venta.
          </div>
        </div>
      </label>
      <label style="display:flex;gap:10px;padding:12px;border:1px solid ${modoLista==='costos'?'var(--gold)':'var(--line)'};
        border-radius:10px;cursor:pointer;${modoLista==='costos'?'background:var(--gold-lt)':''}">
        <input type="radio" name="modoLista" value="costos" ${modoLista==='costos'?'checked':''}
          onchange="window._setModoLista('costos')" style="margin-top:3px">
        <div>
          <div style="font-weight:700">Costos directos (lo que te cobra este proveedor)</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">
            Lo que te factura a vos. Actualiza el costo del producto donde este proveedor sea el preferido.
          </div>
        </div>
      </label>
    </div>
    <div class="bar">
      <button class="btn-ghost" onclick="location.href='./catalogo_hub.html'">Cancelar</button>
      <button class="btn-gold" onclick="window._irAPegar()" ${proveedorId?'':'disabled'}>Siguiente ›</button>
    </div>
  </section>`
}

function renderPegar() {
  const prov = proveedores.find(p => p.id === proveedorId)
  return `<section>
    <div class="box">
      <h3>Pegá la lista de ${prov?.nombre || ''}</h3>
      <p>Un producto por línea, con el precio al final de la línea. Ejemplos: <code>Ibupirac 400 x10 1234,56</code> · <code>Actron 400 X10; $ 2.275</code>.</p>
      <p>Tip: podés usar un chat para convertir el PDF a texto y pegarlo acá.</p>
      <textarea class="field" placeholder="Pegá acá…" oninput="window._setTxt(this.value)">${textoCrudo.replace(/</g,'&lt;')}</textarea>
      ${lineasParseadas.length ? `<p style="margin-top:8px;color:var(--green-tx);font-weight:600">✓ Detectadas ${lineasParseadas.length} líneas con precio.</p>` : ''}
      ${lineasDescartes.length ? `
        <p style="margin-top:4px;color:var(--amber-tx);font-weight:600">
          ⚠ ${lineasDescartes.length} línea${lineasDescartes.length===1?'':'s'} descartada${lineasDescartes.length===1?'':'s'} (sin precio reconocido).
          <button class="btn-ghost" style="padding:3px 10px;font-size:12px;margin-left:6px"
            onclick="window._toggleDescartes()">${verDescartes?'Ocultar':'Ver'}</button>
        </p>
        ${verDescartes ? `
          <div style="margin-top:6px;max-height:180px;overflow:auto;background:var(--amber-bg);border:1px solid var(--amber-tx);border-radius:8px;padding:8px 10px">
            ${lineasDescartes.slice(0, 100).map(l => `<div style="font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--amber-tx);padding:2px 0">${l.replace(/</g,'&lt;')}</div>`).join('')}
            ${lineasDescartes.length > 100 ? `<div style="font-size:11px;color:var(--ink-soft);padding-top:4px">… y ${lineasDescartes.length-100} más</div>` : ''}
          </div>` : ''}
      ` : ''}
    </div>
    <div class="bar">
      <button class="btn-ghost" onclick="window._volverA('elegir')">‹ Volver</button>
      <button class="btn-gold" onclick="window._procesarTexto()" ${lineasParseadas.length?'':'disabled'}>Procesar ›</button>
    </div>
  </section>`
}

function renderClasificar() {
  const pendientes = lineasParseadas.filter(l => !clasif[l.nombre_norm])
  const mapeadas = lineasParseadas.filter(l => clasif[l.nombre_norm]?.estado === 'mapeado')
  const ignoradas = lineasParseadas.filter(l => clasif[l.nombre_norm]?.estado === 'ignorado')
  const nMap = mapeadas.length
  const nIgn = ignoradas.length
  const prodById = new Map(productos.map(p => [p.id, p]))

  // Datalist compartido con todos los productos no mapeados aún.
  const yaMapeados = new Set(Object.values(clasif).filter(c => c.estado==='mapeado' && c.producto_id).map(c => c.producto_id))
  const prodDisponibles = productos.filter(p => !yaMapeados.has(p.id))
  const datalist = `<datalist id="prod-dl">
    ${prodDisponibles.map(p => `<option value="${p.nombre.replace(/"/g,'&quot;')}"></option>`).join('')}
  </datalist>`

  const pendientesHtml = !pendientes.length
    ? `<div class="box"><p>Todas las líneas están clasificadas. ${nMap} mapeadas · ${nIgn} ignoradas.</p></div>`
    : `<div class="box">
        <h3>Clasificar nombres nuevos</h3>
        <p>Escribí para buscar el producto tuyo que corresponde, o marcala como <b>ignorada</b>. Lo que elijas queda guardado y en próximas listas se usa solo.</p>
        <p style="font-size:12px;margin-top:4px;color:var(--ink-soft)"><b>Equivalencia</b>: si el proveedor vende en otra cantidad, ajustá "L = S". Ej: proveedor x10, tu stock x20 → <code>1 = 2</code>.</p>
      </div>
      <div class="box" style="padding:0;overflow:hidden">
        <table>
          <thead>
            <tr>
              <th style="min-width:180px">Nombre en la lista</th>
              <th class="r" style="width:90px">Precio ref</th>
              <th style="min-width:200px">Buscar y mapear</th>
              <th style="width:120px">Equivalencia</th>
              <th style="width:70px;text-align:center">Acción</th>
            </tr>
          </thead>
          <tbody id="tbody-clas">
            ${pendientes.map(l => renderFilaClas(l)).join('')}
          </tbody>
        </table>
      </div>`

  const yaClasHtml = (nMap + nIgn) > 0 ? `
    <div class="box" style="padding:0;overflow:hidden;margin-top:12px">
      <div style="padding:10px 14px;background:var(--line-soft);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)">
        Ya clasificadas · ${nMap} mapeadas · ${nIgn} ignoradas
      </div>
      <table>
        <thead>
          <tr>
            <th style="min-width:180px">Nombre en la lista</th>
            <th class="r" style="width:90px">Precio</th>
            <th>Clasificación</th>
            <th style="width:90px;text-align:center">Acción</th>
          </tr>
        </thead>
        <tbody>
          ${mapeadas.concat(ignoradas).map(l => renderFilaYaClas(l, prodById)).join('')}
        </tbody>
      </table>
    </div>` : ''

  return `<section>
    ${datalist}
    ${pendientesHtml}
    ${yaClasHtml}
    <div class="bar">
      <button class="btn-ghost" onclick="window._volverA('pegar')">‹ Volver</button>
      <button class="btn-gold" id="btn-ver-cambios" onclick="window._armarCambios()">
        ${pendientes.length ? `${pendientes.length} sin clasificar · Ver cambios ›` : 'Ver cambios ›'}
      </button>
    </div>
  </section>`
}

// Fila para la tabla "Ya clasificadas" (debajo de las pendientes).
// Muestra el estado actual con el producto + factor y permite deshacer
// (vuelve esa línea a la zona de pendientes para re-clasificar).
function renderFilaYaClas(l, prodById) {
  const c = clasif[l.nombre_norm]
  const normAttr = l.nombre_norm.replace(/"/g,'&quot;')
  if (c.estado === 'ignorado') {
    return `<tr style="opacity:.7">
      <td style="font-size:13px">${l.nombre}</td>
      <td class="r">${arsCent(l.precio)}</td>
      <td><span class="chip ign">⊘ ignorada</span></td>
      <td style="text-align:center">
        <button class="btn-ghost" style="padding:4px 10px;font-size:12px" onclick="window._deshacerClasif('${normAttr}')">Cambiar</button>
      </td>
    </tr>`
  }
  const prod = prodById.get(c.producto_id)
  const factor = Number(c.factor) || 1
  const factorTxt = Math.abs(factor - 1) > 0.0001 ? ` × ${factor}` : ''
  return `<tr>
    <td style="font-size:13px">${l.nombre}</td>
    <td class="r">${arsCent(l.precio)}</td>
    <td>
      <span class="chip map">✓ mapeada</span>
      <span style="font-weight:600;font-size:13px;margin-left:4px">${prod?.nombre || '(?)'}${factorTxt}</span>
    </td>
    <td style="text-align:center">
      <button class="btn-ghost" style="padding:4px 10px;font-size:12px" onclick="window._deshacerClasif('${normAttr}')">Cambiar</button>
    </td>
  </tr>`
}

function renderFilaClas(l) {
  const eq = eqInputs[l.nombre_norm] || { l: '1', s: '1' }
  const normAttr = l.nombre_norm.replace(/"/g,'&quot;')
  return `<tr data-norm="${normAttr}">
    <td style="font-size:13px">${l.nombre}</td>
    <td class="r">${arsCent(l.precio)}</td>
    <td>
      <input list="prod-dl" class="mini" placeholder="Escribir y elegir…"
        style="width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:#fff"
        onchange="window._mapearPorNombre('${normAttr}', this.value)"
        onkeydown="if(event.key==='Enter'){this.blur()}">
    </td>
    <td>
      <div style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft)">
        <input type="number" step="any" min="0" value="${eq.l}" data-norm="${normAttr}" data-eq="l"
          oninput="window._setEq(this)" style="width:40px;padding:4px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:12px;text-align:center">
        <span>=</span>
        <input type="number" step="any" min="0" value="${eq.s}" data-norm="${normAttr}" data-eq="s"
          oninput="window._setEq(this)" style="width:40px;padding:4px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:12px;text-align:center">
      </div>
    </td>
    <td style="text-align:center">

        onclick="window._ignorar('${normAttr}')">Ignorar</button>
    </td>
  </tr>`
}

// Actualiza el contador del botón sin re-renderizar toda la pantalla.
function refrescarContadorPendientes() {
  const pendientes = lineasParseadas.filter(l => !clasif[l.nombre_norm]).length
  const btn = document.getElementById('btn-ver-cambios')
  if (btn) {
    btn.textContent = pendientes === 0
      ? 'Ver cambios ›'
      : `${pendientes} sin clasificar · Ver cambios ›`
  }
  if (pendientes === 0) render() // ahora sí, mostrar el estado "todo clasificado"
}

// Saca una fila del DOM y limpia la opción del datalist si estaba mapeada.
function ocultarFila(nombreNorm, prodNombre) {
  const tr = document.querySelector(`tr[data-norm="${CSS.escape(nombreNorm)}"]`)
  if (tr) tr.remove()
  if (prodNombre) {
    const opt = document.querySelector(`#prod-dl option[value="${CSS.escape(prodNombre)}"]`)
    if (opt) opt.remove()
  }
}

    ${esCostos ? `

function renderFilaCosto(c) {
  // "Costo ant" = costo oficial del producto (lo que estás usando para margen).
  // "Costo nuevo" = lo que te sale con este proveedor (ya con % adicional).
  // % = diferencia entre ambos → indica si te vende MÁS BARATO (verde, "-X%")
  // o MÁS CARO (rojo, "+X%") que tu costo registrado.
  const pct = c.costo_ant > 0 ? (c.costo_nuevo - c.costo_ant) / c.costo_ant * 100 : 0
  const pctClass = Math.abs(pct) < 0.1 ? 'delta-flat' : pct > 0 ? 'delta-up' : 'delta-down'
  const margenAnt = c.precio_venta_actual > 0 ? (c.precio_venta_actual - c.costo_ant) / c.precio_venta_actual * 100 : 0
  // Costo final en el margen "después": si aplica y es/será preferido, el nuevo manda;
  // si no, usamos el costo del producto que no se toca.
  const seraPreferido = c.esPreferido || c.fijar_preferido
  const precioFin = c.actualizar_venta ? c.precio_sugerido : c.precio_venta_actual
  const costoFin = c.aplicar && seraPreferido ? c.costo_nuevo : c.costo_ant
  const margenNvo = precioFin > 0 ? (precioFin - costoFin) / precioFin * 100 : 0
  const nuevoVal = Number.isFinite(c.precio_sugerido) ? c.precio_sugerido.toFixed(2) : ''
  return `<tr class="${c.aplicar?'':'off'}">
    <td><input type="checkbox" class="cb" ${c.aplicar?'checked':''} onchange="window._togFila(${c.idx}, this.checked)"></td>
    <td>${c.nombre_prod}
      ${c.esPreferido ? '<span style="font-size:10px;background:var(--gold-lt);color:var(--gold-dk);padding:1px 6px;border-radius:4px;margin-left:4px;font-weight:700">PREFERIDO</span>' : ''}
      <div style="font-size:11px;color:var(--ink-soft)">
        ${c.nombre_externo}${c.factor !== 1 ? ` · lista ${arsCent(c.precio_lista_crudo)} × ${c.factor}` : ''}
      </div>
    </td>
    <td class="r">${c.costo_ant ? arsCent(c.costo_ant) : '—'}</td>
    <td class="r">${arsCent(c.costo_nuevo)}</td>
    <td class="r"><span class="${pctClass}">${c.costo_ant ? fmtPct(pct) : 'nuevo'}</span></td>
    <td class="r">${arsCent(c.precio_venta_actual)}</td>
    <td class="r"><input type="number" class="precio" step="0.01" min="0" value="${nuevoVal}"
      oninput="window._editarSugerido(${c.idx}, this.value)"></td>
    <td class="r"><span style="font-size:11px;color:var(--ink-soft)">${margenAnt.toFixed(0)}%</span>
      <span style="color:var(--ink);font-weight:600;font-size:11px"> → ${margenNvo.toFixed(0)}%</span></td>
    <td style="text-align:center"><input type="checkbox" class="cb" ${c.actualizar_venta?'checked':''}
      onchange="window._togVenta(${c.idx}, this.checked)"></td>
    <td style="text-align:center">
      ${c.esPreferido ? '<span style="font-size:10px;color:var(--ink-soft)">ya</span>'
        : `<input type="checkbox" class="cb" ${c.fijar_preferido?'checked':''}
            onchange="window._togFijar(${c.idx}, this.checked)">`}
    </td>
  </tr>`
}

function renderFila(c) {
  const pct = c.precio_ref_ant > 0 ? (c.precio_ref_nuevo - c.precio_ref_ant) / c.precio_ref_ant * 100 : 0
  const pctClass = Math.abs(pct) < 0.1 ? 'delta-flat' : pct > 0 ? 'delta-up' : 'delta-down'
  const margenAnt = c.costo > 0 ? (c.precio_venta_actual - c.costo) / c.precio_venta_actual * 100 : 0
  const margenNvo = c.costo > 0 && c.precio_sugerido > 0 ? (c.precio_sugerido - c.costo) / c.precio_sugerido * 100 : 0
  const nuevoVal = Number.isFinite(c.precio_sugerido) ? c.precio_sugerido.toFixed(2) : ''
  return `<tr class="${c.aplicar?'':'off'}">
    <td><input type="checkbox" class="cb" ${c.aplicar?'checked':''} onchange="window._togFila(${c.idx}, this.checked)"></td>
    <td>${c.nombre_prod}
      <div style="font-size:11px;color:var(--ink-soft)">
        ${c.nombre_externo}${c.factor !== 1 ? ` · lista ${arsCent(c.precio_lista_crudo)} × ${c.factor}` : ''}
      </div>
    </td>
    <td class="r">${c.precio_ref_ant ? arsCent(c.precio_ref_ant) : '—'}</td>
    <td class="r">${arsCent(c.precio_ref_nuevo)}</td>
    <td class="r"><span class="${pctClass}">${c.precio_ref_ant ? fmtPct(pct) : 'nuevo'}</span></td>
    <td class="r">${arsCent(c.precio_venta_actual)}</td>
    <td class="r"><input type="number" class="precio" step="0.01" min="0" value="${nuevoVal}"
      oninput="window._editarSugerido(${c.idx}, this.value)"></td>
    <td class="r"><span style="font-size:11px;color:var(--ink-soft)">${margenAnt.toFixed(0)}%</span>
      <span style="color:var(--ink);font-weight:600;font-size:11px"> → ${margenNvo.toFixed(0)}%</span></td>
  </tr>`
}

// ── EVENTOS ────────────────────────────────────────────────────────────
window._setProv = async v => {
  proveedorId = v
  if (v) {
    try { await cargarProveedor(v) } catch (e) { alert('Error: ' + e.message) }
  }
  render()
}
window._setModoLista = v => { modoLista = v; render() }
window._irAPegar = () => { paso = 'pegar'; textoCrudo = ''; lineasParseadas = []; lineasDescartes = []; verDescartes = false; render() }
window._volverA = p => { paso = p; render() }
window._toggleDescartes = () => { verDescartes = !verDescartes; render() }
window._setTxt = v => {
  textoCrudo = v
  const r = parsearTexto(v)
  const estadoBtnCambia = (r.ok.length > 0) !== (lineasParseadas.length > 0)
  const descartesCambia = r.descartes.length !== lineasDescartes.length
  lineasParseadas = r.ok
  lineasDescartes = r.descartes
  if (estadoBtnCambia || descartesCambia) {
    render()
    const ta = document.querySelector('textarea.field')
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length) }
  }
}

window._procesarTexto = () => {
  const r = parsearTexto(textoCrudo)
  lineasParseadas = r.ok
  lineasDescartes = r.descartes
  // Pre-cargar clasificación según nombres_externos ya conocidos.
  clasif = {}
  const porNorm = new Map(nombresExt.map(n => [n.nombre_norm, n]))
  for (const l of lineasParseadas) {
    const n = porNorm.get(l.nombre_norm)
    if (n) clasif[l.nombre_norm] = {
      estado: n.estado,
      producto_id: n.producto_id,
      factor: Number(n.factor_conversion) || 1,
      dbId: n.id,
    }
  }
  paso = 'clasificar'
  busquedaProd = ''
  render()
}

window._setBusqProd = v => { busquedaProd = v; render() }

// Guardamos los valores "lista = stock" por fila mientras el usuario tipea;
// cuando mapea, convertimos a factor = stock / lista. Default 1 = 1.
const eqInputs = {}  // nombre_norm → { l: '1', s: '1' }
window._setEq = (el) => {
  const norm = el.dataset.norm
  if (!eqInputs[norm]) eqInputs[norm] = { l: '1', s: '1' }
  eqInputs[norm][el.dataset.eq] = el.value
}

function factorDeFila(nombreNorm) {
  const eq = eqInputs[nombreNorm] || { l: '1', s: '1' }
  const l = Number(eq.l), s = Number(eq.s)
  if (!(l > 0) || !(s > 0)) return 1
  return s / l
}

window._mapear = (nombreNorm, prodId) => {
  if (!prodId) return
  clasif[nombreNorm] = { estado: 'mapeado', producto_id: prodId, factor: factorDeFila(nombreNorm) }
  render()
}

// Igual que _mapear pero toma el NOMBRE del producto (viene del datalist/autocomplete).
window._mapearPorNombre = (nombreNorm, nombreProd) => {
  if (!nombreProd) return
  const prod = productos.find(p => p.nombre === nombreProd)
  if (!prod) return  // escrito a mano pero no coincide con ninguno
  clasif[nombreNorm] = { estado: 'mapeado', producto_id: prod.id, factor: factorDeFila(nombreNorm) }
  ocultarFila(nombreNorm, prod.nombre)
  refrescarContadorPendientes()
}

window._ignorar = nombreNorm => {
  clasif[nombreNorm] = { estado: 'ignorado', producto_id: null, factor: 1 }
  ocultarFila(nombreNorm)
  refrescarContadorPendientes()
}

// Deshace la clasificación de una línea (de "Ya clasificadas" vuelve a pendientes).
// Reset del factor y de la clasificación completa; re-render para mostrarla arriba.
window._deshacerClasif = (nombreNorm) => {
  delete clasif[nombreNorm]
  delete eqInputs[nombreNorm]
  render()
}

window._armarCambios = () => {
  const pps = new Map(producProv.map(x => [x.producto_id, x]))
  const prods = new Map(productos.map(p => [p.id, p]))
  const items = []
  const mapeadosHoy = new Set()
  let idx = 0
  for (const l of lineasParseadas) {
    const c = clasif[l.nombre_norm]
    if (!c || c.estado !== 'mapeado' || !c.producto_id) continue
    const prod = prods.get(c.producto_id)
    if (!prod) continue
    mapeadosHoy.add(c.producto_id)
    const pp = pps.get(c.producto_id)
    const factor = Number(c.factor) > 0 ? Number(c.factor) : 1
    const precioVentaActual = Number(prod.precio) || 0
    const esPreferido = prod.proveedor_id === proveedorId

    if (modoLista === 'costos') {
      // El valor de la lista = COSTO (lo que el proveedor te cobra), ya en tu unidad.
      // Aplico cargo extra (flete/impuestos) global al costo nuevo.
      const costoLista = l.precio * factor
      const costoNuevo = costoLista * (1 + (Number(cargosExtraPct) || 0) / 100)
      // "Costo ant" = costo oficial del PRODUCTO (lo que usás para margen hoy),
      // así ves claro si este proveedor te cobra más o menos de lo que tenés.
      const costoProductoAnt = Number(prod.costo) || 0
      const costoProvAnt = Number(pp?.costo) || 0   // costo guardado de este proveedor (si existe)
      const margenAnt = precioVentaActual > 0
        ? (precioVentaActual - costoProductoAnt) / precioVentaActual * 100
        : 0
      // Precio sugerido para MANTENER el margen: nuevo_precio = nuevo_costo / (1 - margen/100)
      // Redondeado al múltiplo de 50 (mismo criterio que Ajustar precios).
      const sugeridoCrudo = margenAnt < 99.9 && costoNuevo > 0
        ? costoNuevo / (1 - margenAnt / 100)
        : precioVentaActual
      const sugeridoVenta = redondear50(sugeridoCrudo)
      const hayCambio = costoProvAnt === 0 || Math.abs(costoNuevo - costoProvAnt) >= 0.01
      items.push({
        idx: idx++,
        nombre_externo: l.nombre,
        nombre_norm: l.nombre_norm,
        producto_id: c.producto_id,
        nombre_prod: prod.nombre,
        factor,
        precio_lista_crudo: l.precio,
        esPreferido,
        costo_lista: costoLista,        // sin % adicional
        costo_ant: costoProductoAnt,    // costo oficial del producto (lo visible como "Costo ant.")
        costo_nuevo: costoNuevo,        // ya con % adicional
        costo_prov_ant: costoProvAnt,
        precio_venta_actual: precioVentaActual,
        precio_sugerido: sugeridoVenta,  // ya redondeado a 50
        // Default marcado SOLO si este proveedor ya es el preferido del producto
        // (y hay cambio real). Para los alternativos no marca por default — vos
        // decidís explícitamente si querés guardar su costo esta vez.
        aplicar: esPreferido && hayCambio,
        actualizar_venta: false,    // opt-in: aplicar sugerido al precio
        fijar_preferido: false,     // opt-in: productos.proveedor_id = proveedorId
        hayCambio,
      })
    } else {
      // Modo "referencia" (comportamiento previo).
      const precioRefAnt = Number(pp?.precio_referencia) || 0
      const ratio = Number(pp?.ratio_venta) || 0
      const precioRefNuevo = l.precio * factor
      const ratioUsado = ratio > 0 ? ratio : (precioVentaActual > 0 && precioRefNuevo > 0 ? precioVentaActual / precioRefNuevo : 1)
      const sugerido = redondear50(ratioUsado * precioRefNuevo)
      const hayCambio = precioRefAnt === 0 || Math.abs(sugerido - precioVentaActual) >= 0.01
      items.push({
        idx: idx++,
        nombre_externo: l.nombre,
        nombre_norm: l.nombre_norm,
        producto_id: c.producto_id,
        nombre_prod: prod.nombre,
        factor,
        precio_lista_crudo: l.precio,
        precio_ref_ant: precioRefAnt,
        precio_ref_nuevo: precioRefNuevo,
        precio_venta_actual: precioVentaActual,
        precio_sugerido: sugerido,
        costo: Number(prod.costo) || 0,
        aplicar: hayCambio,
        hayCambio,
      })
    }
  }
  cambios = items
  // Mapeados que no vinieron en esta lista (según el campo que corresponda)
  if (modoLista === 'costos') {
    orfanos = producProv
      .filter(pp => pp.costo != null && !mapeadosHoy.has(pp.producto_id))
      .map(pp => ({ producto_id: pp.producto_id, nombre: prods.get(pp.producto_id)?.nombre || '(sin nombre)' }))
      .filter(o => o.nombre !== '(sin nombre)')
  } else {
    orfanos = producProv
      .filter(pp => pp.precio_referencia != null && !mapeadosHoy.has(pp.producto_id))
      .map(pp => ({ producto_id: pp.producto_id, nombre: prods.get(pp.producto_id)?.nombre || '(sin nombre)' }))
      .filter(o => o.nombre !== '(sin nombre)')
  }
  paso = 'cambios'
  render()
}

window._togFila = (idx, on) => { if (cambios[idx]) cambios[idx].aplicar = !!on; render() }
window._togAll = on => { cambios.forEach(c => c.aplicar = !!on); render() }
window._setCargosExtra = v => {
  cargosExtraPct = Math.max(0, Number(v) || 0)
  // Recalcular todo manteniendo las elecciones (aplicar / venta / fijar) por fila.
  const flagsPrev = new Map(cambios.map(c => [c.producto_id, { aplicar: c.aplicar, actualizar_venta: c.actualizar_venta, fijar_preferido: c.fijar_preferido }]))
  window._armarCambios()
  for (const c of cambios) {
    const f = flagsPrev.get(c.producto_id)
    if (f) { c.aplicar = f.aplicar; c.actualizar_venta = f.actualizar_venta; c.fijar_preferido = f.fijar_preferido }
  }
  render()
}
window._togVenta = (idx, on) => {
  if (!cambios[idx]) return
  cambios[idx].actualizar_venta = !!on
  if (on) cambios[idx].aplicar = true  // actualizar venta solo tiene sentido si se actualiza el costo
  render()
}
window._togFijar = (idx, on) => {
  if (!cambios[idx]) return
  cambios[idx].fijar_preferido = !!on
  if (on) cambios[idx].aplicar = true
  render()
}
window._editarSugerido = (idx, v) => {
  const n = Number(v)
  if (!cambios[idx]) return
  cambios[idx].precio_sugerido = isFinite(n) ? n : 0
  // Refresca solo la fila (margen); render completo evita volver a construir todo.
  const row = document.querySelectorAll('tbody tr')[idx]
  if (row) {
    const nuevo = row.querySelector('td:last-child')
    const c = cambios[idx]
    const margenAnt = c.costo > 0 ? (c.precio_venta_actual - c.costo) / c.precio_venta_actual * 100 : 0
    const margenNvo = c.costo > 0 && c.precio_sugerido > 0 ? (c.precio_sugerido - c.costo) / c.precio_sugerido * 100 : 0
    nuevo.innerHTML = `<span style="font-size:11px;color:var(--ink-soft)">${margenAnt.toFixed(0)}%</span>
      <span style="color:var(--ink);font-weight:600;font-size:11px"> → ${margenNvo.toFixed(0)}%</span>`
  }
}

async function guardarNombresExternos() {
  // Inserts/updates para los nombres_externos que faltan o cambiaron.
  const porNorm = new Map(nombresExt.map(n => [n.nombre_norm, n]))
  const inserts = []
  const updates = []
  for (const l of lineasParseadas) {
    const c = clasif[l.nombre_norm]
    if (!c) continue
    const factor = Number(c.factor) > 0 ? Number(c.factor) : 1
    const existe = porNorm.get(l.nombre_norm)
    if (!existe) {
      inserts.push({
        empresa_id: usuario.empresa_id,
        proveedor_id: proveedorId,
        nombre_externo: l.nombre,
        nombre_norm: l.nombre_norm,
        producto_id: c.producto_id,
        estado: c.estado,
        factor_conversion: factor,
      })
    } else {
      const factorAnt = Number(existe.factor_conversion) || 1
      const cambio = existe.estado !== c.estado
        || existe.producto_id !== c.producto_id
        || Math.abs(factorAnt - factor) > 1e-9
      if (cambio) {
        updates.push({ id: existe.id, producto_id: c.producto_id, estado: c.estado, factor_conversion: factor })
      }
    }
  }
  if (inserts.length) {
    const { error } = await supabase.from('nombre_externo_proveedor').insert(inserts)
    if (error) throw error
  }
  for (const u of updates) {
    const { error } = await supabase.from('nombre_externo_proveedor')
      .update({
        producto_id: u.producto_id,
        estado: u.estado,
        factor_conversion: u.factor_conversion,
        updated_at: new Date().toISOString(),
      })
      .eq('id', u.id)
    if (error) throw error
  }
}

async function guardarPreciosReferencia() {
  // Para cada mapeado (haya o no cambio seleccionado), actualizar precio_referencia
  // en producto_proveedor. Si no existe la fila, insertarla.
  // Importante: precio_referencia se guarda EN TU UNIDAD (ya convertido con factor).
  const porProd = new Map(producProv.map(pp => [pp.producto_id, pp]))
  const upserts = []
  for (const l of lineasParseadas) {
    const c = clasif[l.nombre_norm]
    if (!c || c.estado !== 'mapeado' || !c.producto_id) continue
    const pp = porProd.get(c.producto_id)
    const prod = productos.find(p => p.id === c.producto_id)
    const precioVenta = Number(prod?.precio) || 0
    const factor = Number(c.factor) > 0 ? Number(c.factor) : 1
    const precioRefConv = l.precio * factor
    // Si el usuario va a aplicar el cambio, el ratio se recalcula solo (trigger)
    // cuando actualicemos productos.precio. Si NO aplica, mantenemos el ratio
    // existente o lo seteamos usando el precio de venta actual.
    let ratio = pp?.ratio_venta
    if (!ratio || ratio <= 0) {
      ratio = (precioVenta > 0 && precioRefConv > 0) ? precioVenta / precioRefConv : 1
    }
    if (pp) {
      upserts.push({ tipo: 'update', id: pp.id, precio_referencia: precioRefConv, ratio_venta: ratio })
    } else {
      // "Solo referencia": este proveedor te manda precio de lista pero no te
      // vende este producto (todavía). costo queda NULL para que la UI de
      // stock no lo muestre como proveedor alternativo real.
      upserts.push({
        tipo: 'insert',
        row: {
          empresa_id: usuario.empresa_id,
          proveedor_id: proveedorId,
          producto_id: c.producto_id,
          costo: null,
          precio_referencia: precioRefConv,
          ratio_venta: ratio,
        }
      })
    }
  }
  for (const u of upserts) {
    if (u.tipo === 'update') {
      const { error } = await supabase.from('producto_proveedor')
        .update({ precio_referencia: u.precio_referencia, ratio_venta: u.ratio_venta })
        .eq('id', u.id)
      if (error) throw error
    } else {
      // Upsert por (producto_id, proveedor_id) — por si ya existe sin precio_ref.
      const { error } = await supabase.from('producto_proveedor')
        .upsert(u.row, { onConflict: 'producto_id,proveedor_id' })
      if (error) throw error
    }
  }
}

async function aplicarPreciosVenta() {
  const seleccion = cambios.filter(c => c.aplicar && c.precio_sugerido > 0)
  for (const c of seleccion) {
    const { error } = await supabase.from('productos')
      .update({ precio: c.precio_sugerido, ultimo_cambio_precio: new Date().toISOString() })
      .eq('id', c.producto_id)
    if (error) throw error
  }
  return seleccion.length
}

// Modo "costos": upsert producto_proveedor.costo, y según flags:
//  - fijar_preferido → productos.proveedor_id = proveedorId
//  - esPreferido (ya) o fijar_preferido → productos.costo = costo_nuevo
//  - actualizar_venta → productos.precio = precio_sugerido
async function guardarCostos() {
  const pps = new Map(producProv.map(x => [x.producto_id, x]))
  const nowISO = new Date().toISOString()
  const prods = new Map(productos.map(p => [p.id, p]))
  let nCostos = 0, nVenta = 0, nFijados = 0

  for (const c of cambios) {
    if (!c.aplicar) continue
    const prod = prods.get(c.producto_id)
    if (!prod) continue

    // 1) Upsert costo del proveedor en producto_proveedor
    const pp = pps.get(c.producto_id)
    if (pp) {
      const { error } = await supabase.from('producto_proveedor')
        .update({ costo: c.costo_nuevo, actualizado_en: nowISO.slice(0,10) })
        .eq('id', pp.id)
      if (error) throw error
    } else {
      const { error } = await supabase.from('producto_proveedor').upsert({
        empresa_id: usuario.empresa_id,
        proveedor_id: proveedorId,
        producto_id: c.producto_id,
        costo: c.costo_nuevo,
      }, { onConflict: 'producto_id,proveedor_id' })
      if (error) throw error
    }
    nCostos++

    // 2) Si fija como preferido, update productos.proveedor_id
    const esAhoraPreferido = c.esPreferido || c.fijar_preferido
    const prodUpdate = {}
    if (c.fijar_preferido && !c.esPreferido) {
      prodUpdate.proveedor_id = proveedorId
      nFijados++
    }
    // 3) Si es el preferido (actual o nuevo), actualizar costo oficial del producto
    if (esAhoraPreferido) {
      prodUpdate.costo = c.costo_nuevo
      prodUpdate.ultimo_cambio_costo = nowISO
    }
    // 4) Si pidió actualizar venta, el precio y su timestamp
    if (c.actualizar_venta && c.precio_sugerido > 0) {
      prodUpdate.precio = c.precio_sugerido
      prodUpdate.ultimo_cambio_precio = nowISO
      nVenta++
    }
    if (Object.keys(prodUpdate).length) {
      const { error } = await supabase.from('productos').update(prodUpdate).eq('id', c.producto_id)
      if (error) throw error
    }
  }
  return { costos: nCostos, venta: nVenta, fijados: nFijados }
}

async function guardarImportacion(cambiosAplicados) {
  const nMap = Object.values(clasif).filter(c => c.estado==='mapeado').length
  const nIgn = Object.values(clasif).filter(c => c.estado==='ignorado').length
  const nNuevos = lineasParseadas.filter(l => !clasif[l.nombre_norm]).length
  await supabase.from('importacion_lista_proveedor').insert({
    empresa_id: usuario.empresa_id,
    proveedor_id: proveedorId,
    usuario_id: usuario.id,
    lineas_total: lineasParseadas.length,
    lineas_mapeadas: nMap,
    lineas_ignoradas: nIgn,
    lineas_nuevas: nNuevos,
    cambios_aplicados: cambiosAplicados,
    mapeados_sin_precio: orfanos.length,
  })
}

window._aplicar = async () => {
  try {
    document.querySelector('.bar .btn-gold').disabled = true
    await guardarNombresExternos()
    let aplicados = 0
    let extraResumen = {}
    if (modoLista === 'costos') {
      const r = await guardarCostos()
      aplicados = r.costos
      extraResumen = { venta: r.venta, fijados: r.fijados }
    } else {
      await guardarPreciosReferencia()
      aplicados = await aplicarPreciosVenta()
    }
    await guardarImportacion(aplicados)
    const provNombre = proveedores.find(p => p.id === proveedorId)?.nombre || ''
    resumenListo = {
      aplicados,
      mapeados: Object.values(clasif).filter(c => c.estado === 'mapeado').length,
      ignorados: Object.values(clasif).filter(c => c.estado === 'ignorado').length,
      orfanos: orfanos.length,
      provNombre,
      modo: modoLista,
      ...extraResumen,
    }
    paso = 'listo'
    render()
  } catch (e) {
    alert('Error al aplicar: ' + (e.message || e))
    document.querySelector('.bar .btn-gold').disabled = false
  }
}

window._nuevaLista = () => {
  paso = 'elegir'; proveedorId = ''; textoCrudo = ''; lineasParseadas = []
  lineasDescartes = []; verDescartes = false
  clasif = {}; cambios = []; orfanos = []; nombresExt = []; producProv = []
  modoLista = 'referencia'
  cargosExtraPct = 0
  resumenListo = null
  render()
}

function toast(msg) {
  const t = document.createElement('div')
  t.className = 'toast'; t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 2400)
}

// ── INIT ───────────────────────────────────────────────────────────────
try {
  await cargarInicial()
} catch (e) {
  root().innerHTML = `<div class="err-box">Error al cargar: ${e.message || e}</div>`
  throw e
}
render()
</script>
