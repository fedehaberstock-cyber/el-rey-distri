<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="./src/logger.js"></script>
<title>El Rey · Pendientes</title>
<style>
  :root{
    --paper:#FBF9F2; --ink:#1C2B27; --ink-soft:#5B665F;
    --line:#E4DECF;  --line-soft:#EEEADD;
    --gold:#A9760E;  --gold-dk:#8A5F09; --gold-lt:#F5E9D0;
    --green-bg:#E7F0E8; --green-tx:#2C6B3F;
    --amber-bg:#FDF2DC; --amber-tx:#8A5F09;
    --red-bg:#F6E5E2;   --red-tx:#A8392B;
    --blue-bg:#E8F0FB;  --blue-tx:#2A4E9A;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:contain;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.4}
  body{max-width:480px;margin:0 auto;padding-bottom:40px}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    border-bottom:1px solid var(--line);background:var(--paper);
    position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .crown{color:var(--gold);font-size:20px}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);
    letter-spacing:.06em;text-transform:uppercase}
  .back{background:none;border:none;color:var(--gold);font-size:13px;font-weight:600;
    cursor:pointer;font-family:inherit}

  .filtros{display:flex;gap:8px;padding:12px 18px;overflow-x:auto;background:var(--paper);
    border-bottom:1px solid var(--line-soft)}
  .chip-f{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);font-size:13px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip-f.on{background:var(--gold);border-color:var(--gold);color:#fff}

  .sec-lbl{padding:14px 18px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft)}

  .ped-card{margin:0 18px 12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden}
  .ped-card.def{border-left:4px solid var(--amber-tx)}
  .ped-card.rol{border-left:4px solid var(--red-tx)}
  .ped-card.prog{border-left:4px solid var(--green-tx)}
  .ped-card.rep{border-left:4px solid var(--blue-tx)}
  .ped-hdr{padding:12px 14px;border-bottom:1px solid var(--line-soft)}
  .ped-hdr .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ped-hdr .nm{font-size:15px;font-weight:700}
  .ped-hdr .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .chip{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;flex-shrink:0}
  .chip.def{background:var(--amber-bg);color:var(--amber-tx)}
  .chip.rol{background:var(--red-bg);color:var(--red-tx)}
  .chip.post{background:var(--blue-bg);color:var(--blue-tx)}
  .chip.prog{background:var(--green-bg);color:var(--green-tx)}
  .btn-acc.ok{background:var(--green-bg);color:var(--green-tx);border-color:var(--green-tx)}

  .items{padding:8px 14px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-soft)}
  .items .it{display:flex;justify-content:space-between;padding:2px 0}
  .total-row{padding:8px 14px;display:flex;justify-content:space-between;font-size:14px;
    font-weight:700;background:var(--line-soft)}

  .acciones{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px}
  .btn-acc{padding:8px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-size:13px;font-weight:600;color:var(--ink);
    cursor:pointer;font-family:inherit;flex:1;min-width:100px}
  .btn-acc.pri{background:var(--gold);color:#fff;border-color:var(--gold)}
  .btn-acc.dan{background:var(--red-bg);color:var(--red-tx);border-color:var(--red-tx)}
  .btn-acc:active{filter:brightness(.95)}

  .fecha-panel{padding:10px 14px;background:var(--gold-lt);border-top:1px solid var(--gold)}
  .fecha-panel label{font-size:12px;font-weight:600;color:var(--gold-dk)}
  .fecha-panel input{margin-top:5px;width:100%;padding:9px;border:1px solid var(--gold);
    border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  .fecha-panel .row-btns{display:flex;gap:6px;margin-top:8px}
  .fecha-panel .row-btns button{flex:1;padding:9px;border-radius:8px;border:none;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .fp-ok{background:var(--gold-dk);color:#fff}
  .fp-cancel{background:var(--card);color:var(--ink);border:1px solid var(--line) !important}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:15px}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:15px}
  .err-box{margin:18px;padding:14px;background:var(--red-bg);border:1px solid var(--red-tx);
    border-radius:12px;color:var(--red-tx);font-size:14px}
</style>
</head>
<body>
<div id="root"><div class="loading">Cargando…</div></div>

<script type="module">
import { supabase } from './src/supabase.js';
import { requireSession, tienePermiso } from './src/auth.js';
import { ars, mostrarError } from './src/utils.js?v=2';

const { usuario } = await requireSession();
if (!tienePermiso('pedidos')) { location.href = './login_home.html'; throw new Error('sin permiso'); }

const esAdminPed = tienePermiso('pedidos', 'admin');
const _fmt = d => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Cordoba'}).format(d);
const HOY = _fmt(new Date());
const MANANA = _fmt(new Date(Date.now() + 86400000));

let pendientes = [];  // {tipo:'a_definir'|'rolleado'|'postergado'|'programado', ...pedido}
let zonasMap = {};
let filtroZona = 'todas';
let fechaAbierta = null;  // pedido_id con panel de fecha abierto
let fechaSel = MANANA;
let motivoSel = '';

async function cargar() {
  // Zonas para filtro y visualización
  const { data: zs } = await supabase.from('zonas')
    .select('id, nombre, modo_reparto').eq('empresa_id', usuario.empresa_id);
  zonasMap = Object.fromEntries((zs || []).map(z => [z.id, z]));

  // Query base: pedidos confirmados (no anulados/entregados) sin hoja o con fecha rara.
  //   - fecha_reparto NULL              → 'a_definir'
  //   - fecha_reparto <  HOY sin hoja   → 'rolleado' (venían de una hoja cerrada)
  //   - estado='postergado'             → 'postergado'
  let q = supabase.from('pedidos')
    .select(`
      id, fecha, fecha_reparto, estado, motivo_no_entrega, usuario_id, hoja_ruta_id,
      cliente_id, clientes(nombre, direccion, zona_id),
      boletas(id, total, saldo_anterior, estado),
      pedido_items(cantidad, productos(nombre)),
      usuarios!pedidos_usuario_id_fkey(nombre)
    `)
    .eq('empresa_id', usuario.empresa_id)
    .in('estado', ['confirmado','postergado']);

  // Filtro por usuario si no es admin de pedidos
  if (!esAdminPed) q = q.eq('usuario_id', usuario.id);

  const { data, error } = await q.order('fecha_reparto', { ascending: true, nullsFirst: true });
  if (error) { document.getElementById('root').innerHTML = `<div class="err-box">Error: ${error.message}</div>`; return; }

  // Set de pedido_ids que ya tienen un rollover previo (visita no_entregado).
  // Esto nos permite distinguir un pedido recién programado a mañana de uno
  // que fue rolleado (debió entregarse antes y no salió).
  const { data: viss } = await supabase.from('visitas_clientes')
    .select('pedido_id').eq('empresa_id', usuario.empresa_id).eq('resultado', 'no_entregado');
  const rolleadosIds = new Set((viss || []).map(v => v.pedido_id).filter(Boolean));

  // Pendiente = todo lo confirmado/postergado que aún no está entregado.
  // Los "programados a futuro" solo aparecen si fueron rolleados previamente
  // (para no llenar la pantalla de pedidos frescos para mañana).
  pendientes = (data || [])
    .filter(p => {
      if (p.estado === 'postergado') return true;
      if (p.fecha_reparto == null)   return true;
      if (p.fecha_reparto <= HOY)    return true;
      // futuro: solo si tuvo rollover previo
      return rolleadosIds.has(p.id);
    })
    .map(p => {
      const fueRolleado = rolleadosIds.has(p.id);
      const tipo = p.estado === 'postergado' ? 'postergado'
                 : p.fecha_reparto == null   ? 'a_definir'
                 : p.fecha_reparto <= HOY    ? 'rolleado'
                 : fueRolleado               ? 'reprogramado'   // futuro con rollover previo
                                              : 'programado';
      return {
        id: p.id,
        cliente_id: p.cliente_id,
        cliente: p.clientes?.nombre || '(sin cliente)',
        dir: p.clientes?.direccion || '',
        zonaId: p.clientes?.zona_id || null,
        vendedor: p.usuarios?.nombre || '',
        fecha: (p.fecha || '').slice(0,10),
        fechaReparto: p.fecha_reparto,
        boletaId: p.boletas?.[0]?.id || null,
        total: Number(p.boletas?.[0]?.total || 0),
        motivo: p.motivo_no_entrega || '',
        items: (p.pedido_items || []).map(it => ({
          nom: it.productos?.nombre || '?',
          cant: Number(it.cantidad),
        })),
        tipo,
      };
    });

  render();
}

function render() {
  const el = document.getElementById('root');
  const zonasConPend = [...new Set(pendientes.map(p => p.zonaId).filter(Boolean))];

  const filtrados = filtroZona === 'todas'
    ? pendientes
    : filtroZona === 'sin_zona'
      ? pendientes.filter(p => !p.zonaId)
      : pendientes.filter(p => p.zonaId === filtroZona);

  const chips = [
    `<button class="chip-f ${filtroZona==='todas'?'on':''}" onclick="window._filZ('todas')">Todas (${pendientes.length})</button>`,
    ...zonasConPend.map(zid => {
      const z = zonasMap[zid];
      const cnt = pendientes.filter(p => p.zonaId === zid).length;
      return `<button class="chip-f ${filtroZona===zid?'on':''}" onclick="window._filZ('${zid}')">${z?.nombre || 'Zona'} (${cnt})</button>`;
    }),
    (pendientes.some(p => !p.zonaId)
      ? `<button class="chip-f ${filtroZona==='sin_zona'?'on':''}" onclick="window._filZ('sin_zona')">Sin zona (${pendientes.filter(p=>!p.zonaId).length})</button>`
      : ''),
  ].filter(Boolean).join('');

  el.innerHTML = `
    <div class="hdr">
      <div class="brand"><span class="crown">&#9818;</span>
        <div>El Rey<small>Pendientes</small></div>
      </div>
      <button class="back" onclick="location.href='./login_home.html'">Inicio ›</button>
    </div>
    <div class="filtros">${chips || '<span style="color:var(--ink-soft);font-size:13px">Sin pendientes</span>'}</div>
    <div id="lista"></div>`;

  const lista = document.getElementById('lista');

  if (!filtrados.length) {
    lista.innerHTML = `<div class="empty">Sin pedidos pendientes ✓</div>`;
    return;
  }

  const grupos = { rolleado: [], a_definir: [], reprogramado: [], postergado: [], programado: [] };
  filtrados.forEach(p => grupos[p.tipo].push(p));

  const titulos = {
    rolleado:     'No entregados / vencidos',
    a_definir:    'A definir fecha',
    reprogramado: 'Reprogramados (esperando entrega)',
    postergado:   'Postergados',
    programado:   'Programados a futuro',
  };

  ['rolleado','a_definir','reprogramado','postergado','programado'].forEach(k => {
    if (!grupos[k].length) return;
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="sec-lbl">${titulos[k]} · ${grupos[k].length}</div>`;
    grupos[k].forEach(p => sec.appendChild(renderCard(p)));
    lista.appendChild(sec);
  });
}

function renderCard(p) {
  const el = document.createElement('div');
  const cls = p.tipo === 'a_definir'    ? 'def'
            : p.tipo === 'rolleado'     ? 'rol'
            : p.tipo === 'reprogramado' ? 'rep'
            : p.tipo === 'programado'   ? 'prog'
            : '';
  el.className = `ped-card ${cls}`;
  const fechaTxt = p.fechaReparto ? p.fechaReparto.split('-').reverse().join('/') : '';
  const chip = p.tipo === 'a_definir'
    ? '<span class="chip def">A DEFINIR</span>'
    : p.tipo === 'rolleado'
      ? `<span class="chip rol">${p.fechaReparto === HOY ? 'HOY' : 'VENCIDO'} ${fechaTxt ? '· ' + fechaTxt : ''}</span>`
      : p.tipo === 'reprogramado'
        ? `<span class="chip post">REPROGRAMADO · ${fechaTxt}</span>`
        : p.tipo === 'programado'
          ? `<span class="chip prog">PROG · ${fechaTxt}</span>`
          : '<span class="chip post">POSTERGADO</span>';

  el.innerHTML = `
    <div class="ped-hdr">
      <div class="top">
        <div style="flex:1;min-width:0">
          <div class="nm">${p.cliente}</div>
          <div class="sub">${p.dir}${p.vendedor ? ' · 👤 ' + p.vendedor : ''}${p.zonaId ? ' · ' + (zonasMap[p.zonaId]?.nombre || '') : ' · sin zona'}</div>
        </div>
        ${chip}
      </div>
      ${p.motivo ? `<div style="margin-top:6px;font-size:12px;color:var(--red-tx);font-weight:600">💬 ${p.motivo}</div>` : ''}
    </div>
    <div class="items">
      ${p.items.slice(0,5).map(it => `<div class="it"><span>${it.nom}</span><span>×${it.cant}</span></div>`).join('')}
      ${p.items.length > 5 ? `<div style="text-align:center;font-size:11px;color:var(--ink-soft);margin-top:3px">+${p.items.length-5} más</div>` : ''}
    </div>
    <div class="total-row"><span>Total</span><span>${ars(p.total)}</span></div>
    <div class="acciones">
      <button class="btn-acc ok" onclick="window._entregado('${p.id}','${p.cliente.replace(/'/g,'\\\'')}')">✓ Entregado</button>
      ${(p.tipo === 'reprogramado' && !esAdminPed)
        ? '<button class="btn-acc" disabled style="opacity:.5;cursor:not-allowed">📅 Ya reprogramado</button>'
        : `<button class="btn-acc pri" onclick="window._abrirFecha('${p.id}')">📅 Reprogramar</button>`}
      ${p.boletaId ? `<button class="btn-acc" onclick="location.href='./editar_boleta.html?id=${p.boletaId}'">✏ Editar</button>` : ''}
      <button class="btn-acc dan" onclick="window._cancelar('${p.id}','${p.cliente.replace(/'/g,'\\\'')}')">✕ Cancelar</button>
    </div>
    ${fechaAbierta === p.id ? `
      <div class="fecha-panel">
        <label>Nueva fecha de reparto</label>
        <input type="date" value="${fechaSel}" min="${HOY}"
          onchange="window._setFecha(this.value)">
        <label style="margin-top:10px;display:block">Motivo (opcional)</label>
        <input type="text" placeholder="Ej: cliente rechazó, pidió otro día…"
          value="${motivoSel}" oninput="window._setMotivo(this.value)"
          style="width:100%;padding:9px;border:1px solid var(--gold);border-radius:8px;
          font-size:14px;font-family:inherit;background:#fff;margin-top:5px">
        <div class="row-btns">
          <button class="fp-cancel" onclick="window._cerrarFecha()">Cancelar</button>
          <button class="fp-ok" onclick="window._reprogramar('${p.id}')">Guardar</button>
        </div>
      </div>` : ''}`;
  return el;
}

window._filZ = z => { filtroZona = z; render(); };
window._abrirFecha = id => {
  fechaAbierta = id;
  fechaSel = MANANA;
  motivoSel = pendientes.find(p => p.id === id)?.motivo || '';
  render();
};
window._cerrarFecha = () => { fechaAbierta = null; motivoSel = ''; render(); };
window._setFecha = v => { fechaSel = v; };
window._setMotivo = v => { motivoSel = v; };

window._reprogramar = async (id) => {
  try {
    const motivo = motivoSel && motivoSel.trim() ? motivoSel.trim() : null;
    const { error } = await supabase.from('pedidos').update({
      fecha_reparto: fechaSel,
      estado: 'confirmado',
      hoja_ruta_id: null,
      entregado: null,
      motivo_no_entrega: motivo,
    }).eq('id', id);
    if (error) throw error;

    // Registrar visita 'no_entregado' con motivo → queda como rollover manual
    // y persiste la trazabilidad del rechazo/postergación.
    const ped = pendientes.find(p => p.id === id);
    if (ped) {
      await supabase.from('visitas_clientes').insert({
        empresa_id: usuario.empresa_id,
        cliente_id: ped.cliente_id || null,
        usuario_id: usuario.id,
        resultado: 'no_entregado',
        motivo,
        pedido_id: id,
      });
    }

    fechaAbierta = null;
    motivoSel = '';
    await cargar();
  } catch (e) { mostrarError('Error: ' + e.message); }
};

window._cancelar = async (id, nombre) => {
  if (!confirm(`¿Cancelar pedido de ${nombre}? Se devolverá el stock.`)) return;
  try {
    const { error } = await supabase.rpc('anular_pedido', { p_pedido_id: id });
    if (error) throw error;
    await cargar();
  } catch (e) { mostrarError('Error: ' + e.message); }
};

window._entregado = async (id, nombre) => {
  const opts = ['1', '2', '3'];
  const forma = prompt(
    `Marcar entregado a ${nombre}. ¿Cómo pagó?\n\n` +
    `  1) Cuenta corriente (queda en deuda)\n` +
    `  2) Efectivo\n` +
    `  3) Transferencia\n\n` +
    `Ingresá 1, 2 o 3:`, '1');
  if (!forma || !opts.includes(forma)) return;
  const map = { '1': 'cuenta_corriente', '2': 'efectivo', '3': 'transferencia' };
  try {
    const { error } = await supabase.rpc('marcar_pedido_entregado', {
      p_pedido_id: id, p_forma_pago: map[forma],
    });
    if (error) throw error;
    await cargar();
  } catch (e) { mostrarError('Error: ' + e.message); }
};

await cargar();
</script>
</body>
</html>
